<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#052423"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </radialGradient>

    <!-- Metallic Theme Gradients -->
    <linearGradient id="tileBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"></stop>
      <stop offset="50%" stop-color="#00b0ff"></stop>
      <stop offset="100%" stop-color="#00273a"></stop>
    </linearGradient>

    <linearGradient id="metalCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"></stop>
      <stop offset="50%" stop-color="#007791"></stop>
      <stop offset="100%" stop-color="#001a24"></stop>
    </linearGradient>

    <linearGradient id="metalGreen2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0bda51"></stop>
      <stop offset="60%" stop-color="#00695c"></stop>
      <stop offset="100%" stop-color="#001f18"></stop>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00e676" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- Dark Background -->
  

  <g filter="url(#glow2)">

    <!-- Top-Left Tile: Growth Chart (Revenue Share) -->
    <g transform="translate(130, 70)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder2)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#01181c"></rect>
      <!-- Trending Up Arrow Icon -->
      <path d="M 50 150 L 90 110 L 120 130 L 170 70 M 170 70 H 130 M 170 70 V 110" stroke="url(#metalGreen2)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" data-index="0"></path>
    </g>

    <!-- Bottom-Left Tile: Business Contract / Deal -->
    <g transform="translate(100, 310)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder2)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#021c23"></rect>
      <!-- Briefcase / Document Icon -->
      <rect x="55" y="80" width="110" height="80" rx="12" fill="none" stroke="url(#metalCyan2)" stroke-width="12"></rect>
      <path d="M 85 80 V 60 C 85 50, 135 50, 135 60 V 80" stroke="url(#metalCyan2)" stroke-width="10" fill="none" data-index="1"></path>
    </g>

    <!-- Center Hero Tile: Handshake / Partnership -->
    <g transform="translate(285, 180)">
      <rect x="0" y="0" width="240" height="240" rx="50" fill="url(#tileBorder2)"></rect>
      <rect x="7" y="7" width="226" height="226" rx="44" fill="#001a1d"></rect>
      <!-- Handshake Icon -->
      <path d="M 50 120 L 85 90 C 95 80, 110 90, 120 100 L 135 115 L 150 100 C 160 90, 175 80, 185 90 L 200 105" stroke="url(#metalGreen2)" stroke-width="14" stroke-linecap="round" fill="none" data-index="2"></path>
      <path d="M 70 140 L 95 165 L 120 140 L 145 165 L 170 140" stroke="url(#metalCyan2)" stroke-width="10" stroke-linecap="round" fill="none" data-index="3"></path>
    </g>

    <!-- Top-Right Tile: Network / Synergy -->
    <g transform="translate(490, 80)">
      
      <rect x="6" y="6" width="198" height="198" rx="40" fill="#031e21"></rect>
      <!-- Connected Nodes Icon -->
      <circle cx="105" cy="65" r="16" fill="url(#metalCyan2)"></circle>
      <circle cx="65" cy="140" r="16" fill="url(#metalCyan2)"></circle>
      <circle cx="145" cy="140" r="16" fill="url(#metalCyan2)"></circle>
      <line x1="105" y1="65" x2="65" y2="140" stroke="url(#metalCyan2)" stroke-width="8"></line>
      <line x1="105" y1="65" x2="145" y2="140" stroke="url(#metalCyan2)" stroke-width="8"></line>
      <line x1="65" y1="140" x2="145" y2="140" stroke="url(#metalCyan2)" stroke-width="8"></line>
    </g>

    <!-- Bottom-Right Tile: Target / Shared Goals -->
    <g transform="translate(470, 320)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder2)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#011b24"></rect>
      <!-- Target Bullseye Icon -->
      <circle cx="110" cy="110" r="55" fill="none" stroke="url(#metalGreen2)" stroke-width="10"></circle>
      <circle cx="110" cy="110" r="30" fill="none" stroke="url(#metalGreen2)" stroke-width="8"></circle>
      <circle cx="110" cy="110" r="12" fill="url(#metalGreen2)"></circle>
    </g>

  </g>
</svg>