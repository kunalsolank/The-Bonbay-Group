<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a232e"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </radialGradient>

    <!-- Vibrant Cyan-Green Theme Gradients -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"></stop>
      <stop offset="50%" stop-color="#00c853"></stop>
      <stop offset="100%" stop-color="#004d40"></stop>
    </linearGradient>

    <linearGradient id="metalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"></stop>
      <stop offset="40%" stop-color="#00838f"></stop>
      <stop offset="100%" stop-color="#00242c"></stop>
    </linearGradient>

    <linearGradient id="metalGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"></stop>
      <stop offset="50%" stop-color="#00897b"></stop>
      <stop offset="100%" stop-color="#00271d"></stop>
    </linearGradient>

    <!-- Filters for Glow & Bevel Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.3"></feDropShadow>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  

  <!-- Main Tile Outer Shadow & Glow -->
  <g filter="url(#dropShadow)">
    
    <!-- Top-Left Tile: Discount / Gift (Customer Value) -->
    <g transform="translate(140, 80)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#041820"></rect>
      <!-- Icon Inside -->
      <path d="M 60 110 L 160 110 M 110 60 L 110 160 M 70 80 Q 110 50 110 110 Q 110 50 150 80 Q 110 110 70 80" stroke="url(#metalCyan)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#neonGlow)" data-index="0" style="opacity: 1; visibility: visible;"></path>
    </g>

    <!-- Bottom-Left Tile: Loyalty / Smile Star -->
    <g transform="translate(100, 310)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#031b1c"></rect>
      <!-- Star Icon -->
      <path d="M 110 45 L 128 88 L 175 92 L 139 123 L 150 168 L 110 144 L 70 168 L 81 123 L 45 92 L 92 88 Z" fill="url(#metalGreen)" data-index="1"></path>
    </g>

    <!-- Center Hero Tile: Customer Profile & Trust Shield -->
    <g transform="translate(290, 180)">
      <rect x="0" y="0" width="240" height="240" rx="50" fill="url(#tileBorder)"></rect>
      <rect x="7" y="7" width="226" height="226" rx="44" fill="#011f26"></rect>
      <!-- Customer User Badge -->
      <circle cx="120" cy="95" r="35" fill="url(#metalCyan)"></circle>
      <path d="M 65 175 C 65 135, 175 135, 175 175 Z" fill="url(#metalCyan)" data-index="2" style="visibility: visible; opacity: 1;"></path>
      <!-- Glow Ring -->
      <circle cx="120" cy="120" r="85" stroke="#00f2fe" stroke-width="4" fill="none" opacity="0.4" filter="url(#neonGlow)"></circle>
    </g>

    <!-- Top-Right Tile: Fast Support / Service -->
    <g transform="translate(490, 70)">
      
      <rect x="6" y="6" width="198" height="198" rx="40" fill="#021a1d"></rect>
      <!-- Lightning / Fast Speed Icon -->
      <path d="M 120 40 L 65 120 L 115 120 L 90 180 L 155 100 L 105 100 Z" fill="url(#metalGreen)" data-index="3"></path>
    </g>

    <!-- Bottom-Right Tile: Cash-back / Coin -->
    <g transform="translate(470, 310)">
      <rect x="0" y="0" width="220" height="220" rx="45" fill="url(#tileBorder)"></rect>
      <rect x="6" y="6" width="208" height="208" rx="40" fill="#031e24"></rect>
      <!-- Coin with $ / Check -->
      <circle cx="110" cy="110" r="55" fill="none" stroke="url(#metalCyan)" stroke-width="12"></circle>
      <path d="M 90 110 L 105 125 L 135 95" stroke="url(#metalCyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" data-index="4" style="opacity: 1; visibility: visible;"></path>
    </g>

  </g>
</svg>